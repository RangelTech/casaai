<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imóvel</title>
<meta name="description" content="Conheça o imóvel em um passeio cinematográfico e agende a sua visita.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--fundo:#050506;--texto:#f5f5f7;--sutil:#a1a1a6;--destaque:#ffb547}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fundo);color:var(--texto);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;z-index:20}
header b{font-weight:800;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--destaque);color:#111;text-decoration:none;font-weight:800;padding:14px 26px;border-radius:999px;transition:transform .25s}
.btn:hover{transform:translateY(-2px)}
.btn.sec{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px)}
.palco{position:relative;height:620vh}
.fixo{position:sticky;top:0;height:100vh;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
.veu{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55)),linear-gradient(180deg,rgba(0,0,0,.35),transparent 25%,transparent 70%,rgba(0,0,0,.6));pointer-events:none}
.carregando{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;color:var(--sutil)}
.frase{position:absolute;left:6vw;right:6vw;top:50%;transform:translateY(-50%);opacity:0;pointer-events:none}
.frase small{display:block;font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--destaque);margin-bottom:16px;font-weight:800}
.frase h2{font-size:clamp(40px,7vw,104px);font-weight:900;line-height:.98;letter-spacing:-.03em;max-width:13ch}
.frase p{margin-top:20px;font-size:clamp(17px,1.6vw,22px);color:#e4e4e8;max-width:40ch;line-height:1.5}
.frase h2,.frase p,.frase small{text-shadow:0 2px 24px rgba(0,0,0,.8)}
.frase.dir{text-align:right}.frase.dir h2,.frase.dir p{margin-left:auto}
.heroi-txt{opacity:1}
.ficha{padding:110px 6vw;max-width:1200px;margin:0 auto}
.preco{font-size:clamp(36px,5vw,64px);font-weight:900;letter-spacing:-.03em}
.local{color:var(--sutil);font-size:19px;margin-top:6px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:36px 0}
.nums div{border:1px solid #222;border-radius:18px;padding:18px;background:#0d0d10}.nums b{display:block;font-size:30px;font-weight:900}.nums span{color:var(--sutil)}
.destaques{display:flex;flex-wrap:wrap;gap:10px}.destaques span{border:1px solid #2a2a30;border-radius:999px;padding:9px 16px;color:#e4e4e8}
.desc{color:#cfcfd6;font-size:18px;line-height:1.7;margin-top:28px;max-width:70ch;white-space:pre-wrap}
.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;padding:0 6vw 100px;max-width:1300px;margin:0 auto}
.galeria img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px}
.final{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10vh 6vw;gap:24px;background:radial-gradient(700px 360px at 50% 0%,color-mix(in srgb,var(--destaque) 18%,transparent),transparent 70%)}
.final h3{font-size:clamp(34px,5vw,72px);font-weight:900;letter-spacing:-.02em;max-width:16ch}
.fixo-wa{position:fixed;right:20px;bottom:20px;z-index:30}
.marca{position:fixed;left:16px;bottom:16px;z-index:30;font-size:12px;color:#ccc;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:999px;text-decoration:none;backdrop-filter:blur(6px)}
@media (max-aspect-ratio:1/1){.frase,.frase.dir{top:auto;bottom:10vh;transform:none;text-align:left}.frase.dir h2,.frase.dir p{margin-left:0}}
@media (prefers-reduced-motion:reduce){.palco{height:auto}.fixo{position:relative}}
</style>
</head>
<body>
<header><b id="h-tit"></b><a class="btn sec" href="#ficha">Ver detalhes</a></header>
<section class="palco" id="palco"><div class="fixo">
  <canvas id="tela"></canvas><div class="veu"></div><div class="carregando" id="carregando">CARREGANDO</div>
  <div class="frase heroi-txt" data-de="-1" data-ate="0.12"><small id="t-local"></small><h2 id="t-heroi"></h2><p id="t-sub"></p></div>
</div></section>
<section class="ficha" id="ficha">
  <div class="preco" id="f-preco"></div><div class="local" id="f-local"></div>
  <div class="nums" id="f-nums"></div><div class="destaques" id="f-dest"></div><p class="desc" id="f-desc"></p>
  <div style="margin-top:36px;display:flex;gap:12px;flex-wrap:wrap"><a class="btn" id="b-wa" href="#">Agendar visita no WhatsApp</a></div>
</section>
<section class="galeria" id="galeria"></section>
<section class="final"><h3 id="f-chamada">Venha conhecer</h3><p style="color:var(--sutil)" id="f-corretor"></p><a class="btn" id="b-wa2" href="#">Falar no WhatsApp</a></section>
<a class="btn fixo-wa" id="b-wa3" href="#" aria-label="WhatsApp">WhatsApp</a>
<a class="marca" id="marca" href="/" hidden>Site feito com Casa AI</a>
<script>
;(async () => {
  const $ = (q) => document.querySelector(q)
  const slug = location.pathname.split('/')[2]
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
  const r = await fetch('/api/publico/' + slug)
  if (!r.ok) { document.body.innerHTML = '<p style="padding:40vh 6vw;text-align:center">Imóvel não encontrado.</p>'; return }
  const im = await r.json(), t = im.textos || {}
  document.documentElement.style.setProperty('--destaque', im.cor || '#ffb547')
  document.title = `${im.titulo} · ${im.bairro || im.cidade || ''}`
  $('#h-tit').textContent = im.corretor || im.titulo
  $('#t-local').textContent = [im.bairro, im.cidade].filter(Boolean).join(' · ')
  $('#t-heroi').textContent = t.titulo_heroi || im.titulo
  $('#t-sub').textContent = t.subtitulo || ''
  const cenas = (t.cenas || []).slice(0, 4), jan = [[0.18, 0.34], [0.40, 0.56], [0.62, 0.78], [0.84, 1.01]]
  $('.fixo').insertAdjacentHTML('beforeend', cenas.map((c, i) => `<div class="frase ${i % 2 ? 'dir' : ''}" data-de="${jan[i][0]}" data-ate="${jan[i][1]}"><small>${esc(c.rotulo)}</small><h2>${esc(c.titulo)}</h2><p>${esc(c.texto)}</p></div>`).join(''))
  const brl = (v) => v ? 'R$ ' + Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + (im.negocio === 'aluguel' ? '/mês' : '') : 'Consulte'
  $('#f-preco').textContent = brl(im.preco)
  $('#f-local').textContent = [im.tipo, im.bairro, im.cidade].filter(Boolean).join(' · ')
  $('#f-nums').innerHTML = [['quartos', 'quartos'], ['suites', 'suítes'], ['banheiros', 'banheiros'], ['vagas', 'vagas'], ['area', 'm²']].filter(([k]) => im[k]).map(([k, n]) => `<div><b>${im[k]}</b><span>${n}</span></div>`).join('')
  $('#f-dest').innerHTML = (t.destaques || []).map((d) => `<span>${esc(d)}</span>`).join('')
  $('#f-desc').textContent = im.descricao || ''
  $('#f-chamada').textContent = t.chamada || 'Venha conhecer'
  $('#f-corretor').textContent = im.corretor ? 'Atendimento: ' + im.corretor : ''
  const wa = im.whatsapp ? `/c/${slug}/whatsapp` : null
  for (const b of ['#b-wa', '#b-wa2', '#b-wa3']) { if (wa) $(b).href = wa; else $(b).hidden = true }
  if (im.marca_casa_ai) $('#marca').hidden = false
  const n = im.quadros, g = [0.15, 0.4, 0.6, 0.8, 0.95].map((f) => String(Math.max(1, Math.round(f * n))).padStart(4, '0'))
  $('#galeria').innerHTML = g.map((q) => `<img src="/c/${slug}/q/${q}.webp" alt="" loading="lazy">`).join('')
  // rolagem quadro a quadro
  const tela = $('#tela'), ctx = tela.getContext('2d'), palco = $('#palco'), frases = [...document.querySelectorAll('.frase')]
  let imgs = new Array(n), atual = -1, alvo = 0
  const ajustar = () => { const k = Math.min(devicePixelRatio || 1, 2); tela.width = innerWidth * k; tela.height = innerHeight * k; atual = -1 }
  function desenhar() { const i = Math.round(alvo); if (i === atual) return; let k = i; while (k > 0 && !(imgs[k] && imgs[k].complete && imgs[k].naturalWidth)) k--
    const im2 = imgs[k]; if (!im2 || !im2.naturalWidth) return; atual = i
    const s = Math.max(tela.width / im2.naturalWidth, tela.height / im2.naturalHeight), w = im2.naturalWidth * s, h = im2.naturalHeight * s
    ctx.drawImage(im2, (tela.width - w) / 2, (tela.height - h) / 2, w, h) }
  function aoRolar() { const rr = palco.getBoundingClientRect(), tot = palco.offsetHeight - innerHeight, p = Math.min(1, Math.max(0, -rr.top / tot)); alvo = p * (n - 1)
    for (const f of frases) { const m = Math.min(1, Math.max(0, Math.min((p - f.dataset.de) / 0.05, (f.dataset.ate - p) / 0.05))); f.style.opacity = m
      f.style.transform = matchMedia('(max-aspect-ratio:1/1)').matches ? `translateY(${(1 - m) * 26}px)` : `translateY(calc(-50% + ${(1 - m) * 26}px))` } }
  const carregar = (i) => new Promise((ok) => { const x = new Image(); x.decoding = 'async'; x.onload = x.onerror = ok; x.src = `/c/${slug}/q/${String(i + 1).padStart(4, '0')}.webp`; imgs[i] = x })
  await carregar(0); ajustar(); aoRolar()
  addEventListener('resize', ajustar); addEventListener('scroll', aoRolar, { passive: true }); (function laco() { desenhar(); requestAnimationFrame(laco) })()
  const ordem = []; for (const p of [8, 4, 2, 1]) for (let i = 0; i < n; i += p) if (!ordem.includes(i)) ordem.push(i)
  for (let i = 0; i < ordem.length; i += 6) await Promise.all(ordem.slice(i, i + 6).map(carregar))
  $('#carregando').remove()
})()
</script>
</body>
</html>
